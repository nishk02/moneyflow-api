spring.application.name=moneyflow-api

# Server
server.port=8080

# SQLite Database
spring.datasource.url=jdbc:sqlite:moneyflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Profiles
spring.profiles.active=dev

# JWT
jwt.secret=${JWT_SECRET:moneyflow-local-dev-secret-key-2026-not-for-prod}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=capacitor://localhost,ionic://localhost

# Root Admin User
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}

# Mail (Brevo SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Invite sign-up link
app.mail-from=${MAIL_FROM:MnyFlo Team <no-reply@mnyflo.com>}
app.invite-signup-url=${INVITE_SIGNUP_URL:https://app.mnyflo.com/signup}
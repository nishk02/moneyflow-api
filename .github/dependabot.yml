# Dependabot, not a pipeline step, runs on GitHub's own schedule and files
# a PR when a Maven dependency has a newer (or fixed) version available.
# Kept separate from ci-cd.yml deliberately: it doesn't gate a deploy, it
# just surfaces "you should look at this" on its own timeline.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

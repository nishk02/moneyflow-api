info:
  name: Invite Member
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/admin/invites"
  body:
    type: json
    data: '{ "email": "rammaduthuri@gmail.com" }'
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.success && res.body.data && res.body.data.token) {
          bru.setEnvVar("INVITE_TOKEN", res.body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

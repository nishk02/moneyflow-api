info:
  name: Verify OTP
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/auth/invites/{{INVITE_TOKEN}}/verify-otp"
  body:
    type: json
    data: '{ "code": "123456" }'
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.success && res.body.data && res.body.data.token) {
          bru.setEnvVar("AUTH_TOKEN", res.body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
info:
  name: Sign Up - Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "firstName": "Nishant",
        "lastName": "Kumar",
        "email": "nishant@moneyflow.test",
        "password": "SecurePass123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.success && res.body.data && res.body.data.token) {
          const token = res.body.data.token;
          bru.setEnvVar("AUTH_TOKEN", token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Cashflow Summary (Date Range)
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/analytics/cashflow-summary?from=2026-09-01&to=2026-09-30"
  params:
    - name: from
      value: 2026-09-01
      type: query
    - name: to
      value: 2026-09-30
      type: query
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

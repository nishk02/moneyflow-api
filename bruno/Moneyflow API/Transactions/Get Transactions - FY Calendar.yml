info:
  name: Get Transactions - FY Calendar
  type: http
  seq: 9

http:
  method: GET
  url: "{{BASE_URL}}/api/transactions?financialYear=2026&financialMonth=05"
  params:
    - name: financialYear
      value: "2026"
      type: query
    - name: financialMonth
      value: "05"
      type: query
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

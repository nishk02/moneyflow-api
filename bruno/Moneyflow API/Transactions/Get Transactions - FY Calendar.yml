info:
  name: Get Transactions - FY Calendar
  type: http
  seq: 9

http:
  method: GET
  url: "{{BASE_URL}}/api/transactions?financialYear=FY26-27&financialMonth=05"
  params:
    - name: financialYear
      value: FY26-27
      type: query
    - name: financialMonth
      value: "05"
      type: query
    - name: size
      value: "10"
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: sort
      value: date
      type: query
      disabled: true
    - name: direction
      value: DESC
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

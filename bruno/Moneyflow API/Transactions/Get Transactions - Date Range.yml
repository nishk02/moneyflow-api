info:
  name: Get Transactions - Date Range
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/api/transactions?from=2026-09-14&to=2026-09-20&sort=date,desc"
  params:
    - name: from
      value: 2026-09-14
      type: query
    - name: to
      value: 2026-09-20
      type: query
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: sort
      value: date,desc
      type: query
    - name: size
      value: "10"
      type: query
      disabled: true
    - name: flowType
      value: EXPENSE
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

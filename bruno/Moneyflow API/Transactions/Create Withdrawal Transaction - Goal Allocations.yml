info:
  name: Create Withdrawal Transaction - Goal Allocations
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/transactions"
  body:
    type: json
    data: |-
      {
        "date": "2026-09-14",
        "type": "TRANSFER",
        "categoryId": "cat-01",
        "accountId": "{{FROM_ACCOUNT_ID}}",
        "amount": 5000,
        "toAccountId": "{{TO_ACCOUNT_ID}}",
        "goalAllocations": [
          {
            "goalId": "28bd4e42-854b-45f0-b895-f15216b5fec9",
            "amount": 5000
          }
        ]
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

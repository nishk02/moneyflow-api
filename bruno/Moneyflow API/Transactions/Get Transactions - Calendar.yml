info:
  name: Get Transactions - Calendar
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/transactions?calendarYear=2026&calendarMonth=08"
  params:
    - name: calendarYear
      value: "2026"
      type: query
    - name: calendarMonth
      value: "08"
      type: query
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

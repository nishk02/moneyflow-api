info:
  name: Get Transactions - Calendar
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/transactions?calendarYear=2026&calendarMonth=8&sort=date,desc"
  params:
    - name: calendarYear
      value: "2026"
      type: query
    - name: calendarMonth
      value: "8"
      type: query
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: sort
      value: date,desc
      type: query
    - name: size
      value: "10"
      type: query
      disabled: true
    - name: flowType
      value: EXPENSE
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

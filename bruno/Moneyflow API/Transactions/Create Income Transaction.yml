info:
  name: Create Income Transaction
  type: http
  seq: 10

http:
  method: POST
  url: "{{BASE_URL}}/api/transactions"
  body:
    type: json
    data: |-
      {
        "date": "2026-07-04",
        "type": "INCOME",
        "categoryId": "cat-17",
        "accountId": "your-account-uuid-here",
        "amount": 10000,
        "notes": "Dividends"
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

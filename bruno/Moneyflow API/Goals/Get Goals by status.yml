info:
  name: Get Goals by status
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/goals?status=IN_PROGRESS"
  params:
    - name: status
      value: IN_PROGRESS
      type: query
      description: IN_PROGRESS or COMPLETED
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
